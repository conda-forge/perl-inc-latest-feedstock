{% set name = "perl-inc-latest" %}
{% set version = "0.500" %}
{% set sha256 = "daa905f363c6a748deb7c408473870563fcac79b9e3e95b26e130a4a8dc3c611" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://cpan.metacpan.org/authors/id/D/DA/DAGOLDEN/inc-latest-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: generic
  script:
    - >-
      perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1 MAKE=make
      && make
      && make test
      && make install VERBINST=1
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
  run:
    - perl

test:
  imports:
    - inc::latest
  commands:
    - prove
  source_files:
    - t

about:
  home: https://github.com/Perl-Toolchain-Gang/inc-latest
  license: Apache-2.0
  license_file: LICENSE
  summary: 'use modules bundled in inc/ if they are newer than installed ones'

extra:
  recipe-maintainers:
    - xileF1337
    - conda-forge/perl-packagers
